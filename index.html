<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>My Movies</title>
		<meta name="description" content="Movie collection app built with Vue 3, TypeScript and Tailwind CSS. Rate, browse and manage your favorite movies." />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="My Movies" />
		<meta property="og:description" content="Movie collection app built with Vue 3, TypeScript and Tailwind CSS. Rate, browse and manage your favorite movies." />
		<script>
			let theme = null;
			try {
				theme = localStorage.getItem('theme');
			} catch {}
			if (theme !== 'light') {
				document.documentElement.classList.add('dark');
			}
		</script>
	</head>
	<body class="min-h-screen text-gray-900 bg-gray-100 dark:text-gray-100 dark:bg-gray-900">
		<div id="app" class="min-h-screen"></div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
